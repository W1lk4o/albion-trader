<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Albion Trader do Wilkao - Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-box">
  <h1>Login</h1>
  <input type="email" id="email" placeholder="Email @gmail.com">
  <input type="password" id="senha" placeholder="Senha">
  <button id="loginBtn">Entrar</button>
  <p id="msg"></p>
</div>

<script>
// Função de login usando JSON local
document.addEventListener('DOMContentLoaded', () => {
    const loginBtn = document.getElementById('loginBtn');
    const emailInput = document.getElementById('email');
    const senhaInput = document.getElementById('senha');
    const msg = document.getElementById('msg');

    loginBtn.addEventListener('click', async () => {
        // Pega o JSON de usuários
        const response = await fetch('data/users.json');
        const users = await response.json();

        // Verifica se o usuário existe
        const user = users.find(u => u.email === emailInput.value && u.senha === senhaInput.value);

        if (user) {
            msg.style.color = 'green';
            msg.textContent = 'Login efetuado com sucesso!';

            // Redireciona para admin ou dashboard
            if (user.admin) {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        } else {
            msg.style.color = 'red';
            msg.textContent = 'E-mail ou senha incorretos!';
        }
    });
});
</script>
</body>
</html>
